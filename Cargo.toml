[workspace]
members = [".", "litemcp-macros"]

[package]
name = "litemcp"
version = "0.9.1"
edition = "2024"
rust-version = "1.85"
description = "LiteMCP — la lib MCP la plus légère en mémoire et la plus rapide : votre serveur MCP en quelques lignes. Streamable HTTP stateless uniquement (POST/SSE sur un socket bindé), zéro runtime async, serde uniquement."
license = "MIT OR Apache-2.0"
repository = "https://github.com/DeamonDev888/litemcp"
readme = "README.md"
keywords = ["mcp", "mcp-server", "llm", "json-rpc", "http"]
categories = ["api-bindings", "network-programming", "web-programming::http-server"]
exclude = [".github", "docs"]

[features]
# Macros procédurales #[tool]/#[resource]/#[prompt] — zéro dépendance externe
# (implémentées uniquement avec `proc_macro` de la bibliothèque standard,
# sans `syn`, `quote` ni `proc-macro2`).
macros = ["dep:litemcp-macros"]
# Adaptateur schemars : n'importe quel type #[derive(JsonSchema)] devient un
# schéma exécuteur (dérivation par schemars, validation par jsonschema).
schemars = ["dep:schemars", "dep:jsonschema"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
litemcp-macros = { path = "litemcp-macros", version = "0.4.0", optional = true }
schemars = { version = "1", optional = true }
jsonschema = { version = "0.60", default-features = false, optional = true }

[dev-dependencies]
# Fuzz du transport HTTP (tests/fuzz_http.rs) — dev uniquement, le cœur du
# crate garde exactement serde + serde_json.
proptest = "1"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
