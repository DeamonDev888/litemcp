[package]
name = "litemcp"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
description = "La lib MCP (Model Context Protocol) la plus légère pour Rust : votre serveur MCP en quelques lignes. Streamable HTTP stateless uniquement (POST/SSE sur un socket bindé), zéro runtime async, serde uniquement."
license = "MIT OR Apache-2.0"
repository = "https://github.com/DeamonDev888/litemcp"
readme = "README.md"
keywords = ["mcp", "mcp-server", "llm", "json-rpc", "http"]
categories = ["api-bindings", "network-programming", "web-programming::http-server"]
exclude = [".github", "docs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
