[package]
name = "litemcp-macros"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Macros procédurales de litemcp (#[tool]) — feature « macros » du crate litemcp."
license = "MIT OR Apache-2.0"
repository = "https://github.com/DeamonDev888/litemcp"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
