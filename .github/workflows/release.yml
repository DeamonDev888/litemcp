# Release — pipeline canonique de publication d'une version.
#
# SEUL workflow déclenché par un tag `v*` : `publish.yml` n'a plus aucun
# déclencheur tag (chemin de secours manuel uniquement) — aucune publication
# ne peut donc partir sur un tag sans être passée par le gate `verify` ci-
# dessous. Quatre jobs séquentiels :
#   1. `verify` — cohérence des versions (cargo metadata : racine = tag/input,
#      macros = exigence exacte de la dépendance, section CHANGELOG présente)
#      PUIS gate qualité (fmt workspace, clippy -D warnings, tests, doc,
#      contenu des deux paquets — scripts/release.ps1) ;
#   2. `publish` — publication crates.io IDEMPOTENTE via scripts/release.ps1
#      : litemcp-macros d'abord, puis litemcp ; le job REVALIDE lui-même les
#      versions (`cargo metadata`) juste avant le premier `cargo publish`,
#      l'API crates.io est interrogée avec distinction stricte 200/404/autre —
#      une erreur réseau n'est JAMAIS une preuve d'absence, un
#      « already uploaded » est traité comme déjà-publié (docs/RELEASE.md).
#      Jeton : secret `CARGO_REGISTRY_TOKEN` s'il existe, sinon OIDC
#      (trusted publishing crates.io, jeton éphémère) ;
#   3. `github-release` — release GitHub (corps extrait de la section
#      `## [X.Y.Z]` du CHANGELOG.md) — SEUL job avec `contents: write` ;
#   4. `notifier` — notification du dépôt du tutoriel, APRÈS la publication ET
#      la release GitHub (publication+notification fusionnées ici : plus de
#      second chemin de publication).
# Chemin de secours manuel (break-glass) : dispatch de publish.yml, qui
# impose le MÊME gate `verify`. Détail : docs/RELEASE.md.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publier (ex. 0.10.10) — vide : le tag courant, sinon Cargo.toml'
        required: false
        type: string

# Lecture seule au niveau du workflow : seul le job `github-release` élève à
# `contents: write`.
permissions:
  contents: read

# Même groupe que `publish.yml` (break-glass) : les runs de publication sont
# sérialisés — combiné à l'idempotence, cela écarte toute publication en
# double d'une même version.
concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  verify:
    name: Verifier (coherence des versions + simulations + fmt, clippy, tests, doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      # Cohérence AVANT le gate lourd : un tag incohérent échoue en secondes.
      - name: Coherence des versions (tag/input ↔ cargo metadata ↔ CHANGELOG)
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Le tag est dérivé par le script depuis GITHUB_REF (aucun indicateur
          # optionnel : un tag présent ne peut pas être ignoré en silence).
          # Aucun argument vide n'est transmis — `pwsh -File script.ps1 -Param ""`
          # n'est pas portable (Windows PowerShell 5.1 supprime l'argument vide
          # et la liaison échoue en « argument manquant »).
          ARGS=(check)
          if [ -n "$VERSION_INPUT" ]; then ARGS+=(-InputVersion "$VERSION_INPUT"); fi
          V=$(pwsh -NoProfile -File scripts/release.ps1 "${ARGS[@]}" \
            | sed -n 's/^version=//p' | tail -1)
          if [ -z "$V" ]; then
            echo "coherence non resolue — abandon avant tout test et toute publication"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version a publier : $V"

      # Gate qualité : fmt workspace + clippy strict + tests + doc + contenu
      # des paquets. Chaque étape court-circuite le pipeline.
      - name: Gate qualite (fmt, clippy, tests, doc, paquets)
        run: pwsh -NoProfile -File scripts/release.ps1 verify

  publish:
    name: Publier sur crates.io (macros puis racine)
    needs: verify
    runs-on: ubuntu-latest
    # `id-token: write` sert uniquement à l'échange OIDC crates.io (jeton
    # éphémère, révoqué en fin de job) et reste confiné à CE job : tout le
    # reste du pipeline demeure en lecture seule.
    permissions:
      contents: read
      id-token: write
    env:
      # Voie 1 (compatibilité) : le secret `CARGO_REGISTRY_TOKEN` s'il existe.
      # Voie 2 : trusted publishing crates.io (OIDC) quand il est absent.
      HAS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    outputs:
      version: ${{ steps.recheck.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Revalidation locale du gate : ce job est le seul à écrire sur
      # crates.io, il ne publie donc rien qu'il n'ait lui-même confronté à
      # `cargo metadata` (racine ↔ tag/input, macros ↔ exigence de la
      # dépendance) et au CHANGELOG. La garantie ne dépend pas de l'ordre des
      # jobs ni d'un output recopié : un job `publish` rejoué seul repasse le
      # contrôle.
      - name: Coherence des versions avant publication
        id: recheck
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ARGS=(check)
          if [ -n "$VERSION_INPUT" ]; then ARGS+=(-InputVersion "$VERSION_INPUT"); fi
          V=$(pwsh -NoProfile -File scripts/release.ps1 "${ARGS[@]}" \
            | sed -n 's/^version=//p' | tail -1)
          if [ -z "$V" ]; then
            echo "coherence non resolue — abandon avant toute publication"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version a publier : $V"

      # Trusted publishing : le jeton crates.io est échangé contre le JWT OIDC
      # du workflow (durée de vie courte, révoqué en post-step). L'étape est
      # ignorée dès qu'un secret est configuré — aucune rupture pour les
      # dépôts qui publient déjà avec `CARGO_REGISTRY_TOKEN`.
      - name: Jeton crates.io par OIDC (aucun secret configure)
        id: auth
        if: env.HAS_REGISTRY_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publier sur crates.io (idempotent, erreurs reseau non masquees)
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.HAS_REGISTRY_TOKEN == 'true' && secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: pwsh -NoProfile -File scripts/release.ps1 publish -Version ${{ steps.recheck.outputs.version }}

  github-release:
    name: Release GitHub
    # Uniquement sur un push de tag : un dispatch manuel verifie et publie,
    # mais ne cree pas de release (aucun tag a rattacher — eviter de creer
    # un tag sur le commit d'une branche par surprise).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    # SEUL job du pipeline avec une ecriture sur le depot (creation de la
    # release) — tout le reste reste en lecture seule.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extraire le corps depuis le CHANGELOG
        id: corps
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          FICHIER=$(mktemp)
          # Section `## [X.Y.Z]` (prefixe exact, le `]` evite 0.7 vs 0.7.1)
          # jusqu'au prochain titre `## `. Le gate de coherence ayant exige
          # la section avant publication, le corps de repli ne sert qu'au
          # cas ou le CHANGELOG serait modifie entre les deux jobs.
          if awk -v cible="## [$V]" \
            'index($0, cible) == 1 {dans=1; next} dans && /^## / {exit} dans {print}' \
            CHANGELOG.md > "$FICHIER" && [ -s "$FICHIER" ]; then
            echo "section CHANGELOG trouvee pour [$V]"
          else
            echo "section [$V] absente du CHANGELOG.md — corps de repli" >&2
            printf 'Version %s — voir [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md).\n' \
              "$V" "$GITHUB_REPOSITORY" > "$FICHIER"
          fi
          echo "path=$FICHIER" >> "$GITHUB_OUTPUT"

      - name: Creer la release GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: LiteMCP ${{ github.ref_name }}
          body_path: ${{ steps.corps.outputs.path }}
          draft: false
          prerelease: ${{ contains(needs.publish.outputs.version, '-') }}

  notifier:
    name: Notifier le tuto
    needs: [publish, github-release]
    # La notification part APRÈS une publication réussie ET la release GitHub :
    # le tuto ne peut pas annoncer une version dont la release n'existe pas
    # encore. Un dispatch manuel ne crée pas de release (job ignoré) et reste
    # notifié ; un échec de l'un des deux interrompt la chaîne (le cron hebdo
    # rattrape). Une republication idempotente re-notifie volontairement —
    # c'est le cas d'usage du break-glass (cf. docs/RELEASE.md).
    if: >-
      always() &&
      needs.publish.result == 'success' &&
      (needs.github-release.result == 'success' || needs.github-release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer l'evenement au repo du tuto
        env:
          GH_TOKEN: ${{ secrets.TUTO_DISPATCH_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "TUTO_DISPATCH_TOKEN absent — notification ignoree (le cron hebdo rattrapera)"
            exit 0
          fi
          code=$(curl -s -o /tmp/disp_resp.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/DeamonDev888/litemcp-tuto/dispatches \
            -d "{\"event_type\":\"litemcp-version\",\"client_payload\":{\"version\":\"$VERSION\"}}")
          if [ "$code" = "204" ]; then
            echo "evenement litemcp-version envoye (v$VERSION) — HTTP 204"
          else
            echo "envoi de l'evenement impossible (HTTP $code) — le cron hebdo rattrapera"
            cat /tmp/disp_resp.json || true
          fi
