# Publication — chemin de secours MANUEL (break-glass) vers crates.io +
# notification du tuto.
#
# AUCUN déclencheur tag : la publication canonique sur tag `v*` est
# `release.yml` (coherence + verify → publish → release GitHub → notification).
# Ce workflow ne part que sur dispatch manuel (input `version`) et impose le
# MÊME gate `verify` que le pipeline canonique — jamais de publication sans
# gate, même en secours. Trois jobs :
#   1. `verify` — cohérence des versions (cargo metadata : input = racine,
#      macros = exigence exacte de la dépendance, section CHANGELOG présente)
#      PUIS gate qualité (fmt workspace, clippy -D warnings, tests all-features
#      ET sans features par défaut, chaque feature isolée, doc rustdoc stricte
#      RUSTDOCFLAGS=-D warnings, contenu des deux paquets — scripts/release.ps1) ;
#   2. `publish` — publication crates.io IDEMPOTENTE via scripts/release.ps1
#      (macros d'abord, 200/404/autre distingués : une erreur réseau n'est
#      JAMAIS une preuve d'absence). Le job REVALIDE les versions juste avant
#      le premier `cargo publish` : la garantie ne dépend ni de l'ordre des
#      jobs ni d'un output recopié. Jeton : secret `CARGO_REGISTRY_TOKEN` s'il
#      existe, sinon OIDC (trusted publishing crates.io) ;
#   3. `notifier` — envoie l'evenement `litemcp-version` au repo du tuto, qui
#      met alors sa doc a jour automatiquement.
#
# Le `notifier` ne part qu'APRES une publication confirmée : le tuto ne peut
# donc jamais suivre une version qui n'est pas publiee. Si le token de
# notification est absent, le tuto suivra quand même — via le filet de
# securite hebdomadaire (cron) du workflow maj-version.

name: Publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publier (ex. 0.10.10) — doit egaler le manifeste racine et la section CHANGELOG'
        required: true
        type: string

permissions:
  contents: read

# Même groupe que `release.yml` (canonique) : les runs de publication sont
# sérialisés — combiné à l'idempotence, cela écarte toute publication en
# double d'une même version.
concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  verify:
    name: Verifier (coherence des versions + simulations + fmt, clippy, tests, matrice de features, doc stricte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Cohérence AVANT le gate lourd : une version incohérente échoue en
      # secondes. L'input est obligatoire — il doit égaler le manifeste.
      - name: Coherence des versions (input ↔ cargo metadata ↔ CHANGELOG)
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Aucun argument vide n'est transmis — `pwsh -File script.ps1 -Param ""`
          # n'est pas portable (Windows PowerShell 5.1 supprime l'argument vide
          # et la liaison échoue en « argument manquant »).
          ARGS=(check)
          if [ -n "$VERSION_INPUT" ]; then ARGS+=(-InputVersion "$VERSION_INPUT"); fi
          V=$(pwsh -NoProfile -File scripts/release.ps1 "${ARGS[@]}" \
            | sed -n 's/^version=//p' | tail -1)
          if [ -z "$V" ]; then
            echo "coherence non resolue — abandon avant tout test et toute publication"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version a publier : $V"

      - name: Gate qualite (fmt, clippy, tests, doc, paquets)
        run: pwsh -NoProfile -File scripts/release.ps1 verify

  publish:
    name: Publier sur crates.io (macros puis racine)
    needs: verify
    runs-on: ubuntu-latest
    # `id-token: write` sert uniquement à l'échange OIDC crates.io (jeton
    # éphémère, révoqué en fin de job) et reste confiné à CE job.
    permissions:
      contents: read
      id-token: write
    env:
      # Voie 1 (compatibilité) : le secret `CARGO_REGISTRY_TOKEN` s'il existe.
      # Voie 2 : trusted publishing crates.io (OIDC) quand il est absent.
      HAS_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    outputs:
      version: ${{ steps.recheck.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Revalidation locale du gate, juste avant le premier `cargo publish` :
      # le break-glass ne publie rien qu'il n'ait lui-même confronté à
      # `cargo metadata` (racine ↔ input, macros ↔ exigence de la dépendance)
      # et au CHANGELOG, même si le job `verify` était ignoré ou rejoué à part.
      - name: Coherence des versions avant publication
        id: recheck
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ARGS=(check)
          if [ -n "$VERSION_INPUT" ]; then ARGS+=(-InputVersion "$VERSION_INPUT"); fi
          V=$(pwsh -NoProfile -File scripts/release.ps1 "${ARGS[@]}" \
            | sed -n 's/^version=//p' | tail -1)
          if [ -z "$V" ]; then
            echo "coherence non resolue — abandon avant toute publication"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version a publier : $V"

      # Trusted publishing : jeton éphémère échangé contre le JWT OIDC du
      # workflow, révoqué en post-step. Ignoré si un secret est configuré.
      - name: Jeton crates.io par OIDC (aucun secret configure)
        id: auth
        if: env.HAS_REGISTRY_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publier sur crates.io (idempotent, erreurs reseau non masquees)
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.HAS_REGISTRY_TOKEN == 'true' && secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: pwsh -NoProfile -File scripts/release.ps1 publish -Version ${{ steps.recheck.outputs.version }}

  notifier:
    name: Notifier le tuto
    needs: publish
    # Déclenché par une publication RÉUSSIE (y compris « déjà en ligne » :
    # c'est le cas d'usage du break-glass — rejouer la notification sans
    # recréer de tag). Le tuto ne peut jamais suivre une version qui n'est
    # pas en ligne.
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer l'evenement au repo du tuto
        env:
          GH_TOKEN: ${{ secrets.TUTO_DISPATCH_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "TUTO_DISPATCH_TOKEN absent — notification ignoree (le cron hebdo rattrapera)"
            exit 0
          fi
          code=$(curl -s -o /tmp/disp_resp.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/DeamonDev888/litemcp-tuto/dispatches \
            -d "{\"event_type\":\"litemcp-version\",\"client_payload\":{\"version\":\"$VERSION\"}}")
          if [ "$code" = "204" ]; then
            echo "evenement litemcp-version envoye (v$VERSION) — HTTP 204"
          else
            echo "envoi de l'evenement impossible (HTTP $code) — le cron hebdo rattrapera"
            cat /tmp/disp_resp.json || true
          fi
