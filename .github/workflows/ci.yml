name: CI

# Les jobs se déclenchent automatiquement sur tout push vers main et sur
# TOUTE pull request (quelle que soit la branche source). La protection de
# branche les rend requis avant merge + 1 approbation.
on:
  push:
    branches: [main]
  pull_request:

# Lecture seule : la CI ne fait que lire le dépôt (aucune écriture, aucun
# secret de publication).
permissions:
  contents: read

# Un seul run actif par ref : un nouveau push sur la même branche/PR annule
# le run supplanté (économise les runners, résultats plus rapides).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par SHA de commit (même politique que les workflows
      # de publication) : un tag peut être déplacé, un SHA non.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Configuration minimale servie par `default-features = false` : le noyau
      # (serde, serde_json, getrandom) doit être clippy-propre sans aucune feature.
      - name: Clippy (sans features par defaut)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features
      # La configuration par defaut (`default = ["macros"]`) est celle que
      # recoivent tous les utilisateurs : `--all-features` ne la prouve pas.
      - name: Tests (configuration par defaut)
        run: cargo test --workspace
      # Matrice de features : `--all-features` ne prouve rien des configurations
      # servies aux utilisateurs. Tests complets sans les features par défaut,
      # puis CHAQUE feature isolée : testée, pas seulement compilée (une cible
      # de test cassée sous `--features schemars` seule passait la CI). Le gate
      # de release (`cargo run -p release-tool -- verify`) exécute les mêmes commandes.
      - name: Tests (sans features par defaut)
        run: cargo test --workspace --no-default-features
      - name: Feature macros isolee
        run: cargo check -p litemcp --no-default-features --features macros
      - name: Tests feature macros isolee
        run: cargo test -p litemcp --no-default-features --features macros
      - name: Feature schemars isolee
        run: cargo check -p litemcp --no-default-features --features schemars
      - name: Tests feature schemars isolee
        run: cargo test -p litemcp --no-default-features --features schemars
      # Features d'authentification, ajoutees en 0.12.0 : `auth-sign`
      # (ed25519-dalek) et `tls` (rustls + ring + rcgen) tirent des crates que
      # `--all-features` compile avec le reste ; testees seules, elles prouvent
      # que le crate et ses suites tiennent sans les autres features.
      - name: Feature auth-sign isolee
        run: cargo check -p litemcp --no-default-features --features auth-sign
      - name: Tests feature auth-sign isolee
        run: cargo test -p litemcp --no-default-features --features auth-sign
      - name: Feature tls isolee
        run: cargo check -p litemcp --no-default-features --features tls
      - name: Tests feature tls isolee
        run: cargo test -p litemcp --no-default-features --features tls
      # Les exemples sont la porte d'entree du README (`cargo run --example
      # hello`) : ils doivent compiler dans la configuration la plus large.
      - name: Exemples (toutes features)
        run: cargo build --examples --all-features
      # Les garde-fous du pipeline de publication (créé `release-tool` :
      # tag incohérent, tests rouges, version déjà publiée, réseau
      # indisponible, contenu des paquets) tournent sur chaque job de test —
      # les simulations vivent dans `release-tool/tests/simulations.rs`, donc
      # `cargo test --workspace` ci-dessus les exécute sans publication ni
      # secret. `tests/release_pipeline.rs` couvre la structure des workflows.
      - name: Doc (rustdoc strict)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  msrv:
    # MSRV déclaré dans Cargo.toml (rust-version = "1.85") : vérifié à part
    # pour ne pas bloquer le job principal sur la toolchain stable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85
      - name: Check MSRV
        run: cargo check --workspace --all-targets --all-features

  windows:
    # Le crate fait du TCP/HTTP brut et de l'annonce de registre : la
    # sémantique socket et les ACL de fichiers diffèrent de Linux, et Windows
    # est la plateforme de développement. Suite par défaut ET toutes features
    # (TLS via `ring`, sans cmake ni NASM : vérifié sur Windows 11, rustc 1.99.1).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Tests (configuration par defaut)
        run: cargo test --workspace
      - name: Tests (toutes features)
        run: cargo test --workspace --all-features

  macos:
    # Même raison que pour Windows, autre système : le crate fait du TCP/HTTP
    # brut et de l'annonce de registre, dont la sémantique socket (SIGPIPE,
    # réutilisation d'adresses, chemins de fichiers temporaires) diffère de
    # Linux. Suite par défaut ET toutes features, comme pour Windows.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Tests (configuration par defaut)
        run: cargo test --workspace
      - name: Tests (toutes features)
        run: cargo test --workspace --all-features

  advisories:
    # Chaîne d'approvisionnement : échoue sur tout advisory RustSec connu.
    # Cargo.lock n'est pas versionné (convention lib) : les dépendances sont
    # résolues à la volée — la vérification porte donc sur les versions
    # compatibles les plus récentes, ce qui est le but ici.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@98b24ef8830c90613ec3b57343df3abde2b66e56 # cargo-deny
        with:
          tool: cargo-deny
      - name: Advisories
        run: cargo deny check advisories

  # Garde-fou d'attribution : un trailer `Co-Authored-By: Claude …` inscrit le
  # compte @claude dans la liste des contributeurs du dépôt, d'où il ne peut
  # plus être retiré sans réécrire l'historique public. Aucun commit du dépôt
  # n'en porte plus : le tag v0.12.0 a été déplacé sur le commit amendé de la
  # release (arbre identique, message seul différent). Aucun commit nouveau ne
  # doit en ajouter. Le motif est ancré en début de ligne : un trailer, pas une
  # simple mention en prose.
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Aucun trailer d'attribution IA
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            commits="$(git rev-list -n 1 HEAD)"
          else
            commits="$(git rev-list "$base"..HEAD)"
          fi
          if [ -z "$commits" ]; then
            echo "aucun commit nouveau a verifier"
            exit 0
          fi
          if git log --format=%B $commits | grep -Eai '^[[:space:]]*co-authored-by:.*(claude|anthropic)|^[[:space:]]*claude-session:'; then
            echo "::error::attribution IA detectee dans un message de commit (voir ci-dessus)"
            exit 1
          fi
          echo "aucune attribution IA dans $(printf '%s\n' "$commits" | wc -l) commit(s)"
